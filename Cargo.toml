[package]
name = "kvikk"
version = "0.3.0"
edition = "2021"
authors = ["Lars Halvor"]
description = "A fast, keyboard-first native PDF reader for deep reading and skimming"
license = "MIT"
homepage = "https://halvorhansen.no"
keywords = ["pdf", "reader", "rust", "ocr"]
categories = ["gui"]

[dependencies]
egui = "0.36.1"
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7543", "image_025"] }
crossbeam-channel = "0.5.15"
image = { version = "0.25.6", default-features = false, features = ["png"] }
leptess = "0.14.0"
rfd = { version = "0.15.4", default-features = true }
anyhow = "1.0.99"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
